# Public-model normal-lite configuration for repeatable local proof runs
env:
  group_size: 4
  batch_size: 16
  max_batches_offpolicy: 2
  tokenizer_name: "Qwen/Qwen3-8B"
  use_wandb: false
  rollout_server_url: "http://localhost:8000"
  wandb_name: "atropos-tinker-default-public-normal-lite-env"
  ensure_scores_are_not_same: false
  max_token_length: 192
  max_num_workers: 8
  total_steps: 12
  steps_per_eval: 100

openai:
  - model_name: "Qwen/Qwen3-8B"
    base_url: "http://localhost:8001/v1"
    api_key: "x"
    weight: 1.0
    num_requests_for_eval: 32

# Tinker-specific configuration
tinker:
  lora_rank: 16
  learning_rate: 0.00004
  max_token_trainer_length: 1024
  checkpoint_dir: "./temp/"
  save_checkpoint_interval: 0
  wandb_project: "atropos-tinker-default-public-normal-lite"
  wandb_group: null
  wandb_run_name: "atropos-tinker-default-public-normal-lite-run"

slurm: false
testing: false
